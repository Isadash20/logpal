<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a3f74"/>
      <stop offset="1" stop-color="#5e2246"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- Calorie ring: three quarters filled, open at the top-right like the Home ring -->
  <circle cx="512" cy="512" r="300" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="92"/>
  <path d="M 512 212 A 300 300 0 1 0 724 300" fill="none" stroke="#ffffff" stroke-width="92" stroke-linecap="round"/>
  <!-- Protein amber dot marks the open end -->
  <circle cx="724" cy="300" r="46" fill="#e2a93a"/>
</svg>
